name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          if [ -f playx.zip ]; then mkdir -p _src && unzip -oq playx.zip -d _src; fi
          if [ -d _src/PlayX ]; then echo "PROJ=_src/PlayX" >> $GITHUB_ENV; else echo "PROJ=." >> $GITHUB_ENV; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PlayX-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
