name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          for z in *.zip; do
            if [ -f "$z" ]; then mkdir -p _src && unzip -oq "$z" -d _src; fi
          done
          S=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$S" ]; then
            echo "No se encontro el proyecto. Archivos del repositorio:"
            ls -R | head -60
            exit 1
          fi
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
      - name: Icono personalizado
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            pip install pillow -q
            python3 - <<'PY'
          import os
          from PIL import Image
          P = os.environ["PROJ"]
          im = Image.open("icon.png").convert("RGBA")
          for n, s in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              d = f"{P}/app/src/main/res/mipmap-{n}"
              os.makedirs(d, exist_ok=True)
              im.resize((s, s), Image.LANCZOS).save(d + "/ic_launcher.png")
          x = f"{P}/app/src/main/AndroidManifest.xml"
          t = open(x).read().replace("@drawable/ic_launcher", "@mipmap/ic_launcher")
          open(x, "w").write(t)
          v = f"{P}/app/src/main/res/drawable/ic_launcher.xml"
          if os.path.exists(v):
              os.remove(v)
          PY
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PlayX-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
